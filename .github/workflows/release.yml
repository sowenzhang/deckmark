name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag '$TAG' does not match package.json version '$PKG_VERSION'."
            echo "Bump the version in package.json, .claude-plugin/plugin.json, and .claude-plugin/marketplace.json before tagging."
            exit 1
          fi
          echo "Tag matches package.json: $TAG"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack
        run: |
          npm pack
          mv deckmark-*.tgz deckmark.tgz
          ls -lh deckmark.tgz

      - name: Create / update GitHub Release with tarball asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: deckmark.tgz
